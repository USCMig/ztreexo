name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The definition-of-done sweeps are too slow for every push.
  schedule:
    - cron: "0 4 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked` on every cargo invocation below: Cargo.lock is committed, so
      # CI must resolve to exactly what a developer resolved to. Without it a
      # dependency can float in CI and nothing notices until the versions
      # disagree about something that matters.
      #
      # `--all-targets` matters too: it covers tests and benches, which is where
      # the panicking-construct bans are easiest to violate by accident.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked

      # Compiling the benches catches API drift without paying for a run.
      - name: Benches compile
        run: cargo bench --workspace --no-run --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Per-file coverage floors. CLAUDE.md Phase 1 sets its bar on one file —
  # "100% branch coverage on imt.rs" — which a workspace average would let rot,
  # so scripts/check_coverage.py enforces per-file.
  #
  # Nightly is required, not preferred: branch coverage needs
  # `-Z coverage-options=branch`, which stable rejects. That is why the Phase 1
  # criterion had never actually been measured. See PLAN.md.
  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Discard any inherited coverage profiles before measuring.
      #
      # A CI runner is normally clean, so this is defensive — but the failure
      # mode is bad enough to be worth one command. `llvm-cov` merges every
      # .profraw it finds, including ones written by an earlier build of
      # different code. The result is not obviously wrong: `covered` stays
      # correct while `notcovered` fills with regions from binaries that no
      # longer exist.
      #
      # Locally this reported imt.rs at 57% when it was really 96%, and
      # proof.rs at 64% when it was 98% — numbers that read as a catastrophic
      # regression and would have justified gutting the floors. Anyone running
      # this job by hand should run the clean step too.
      - name: Discard stale coverage profiles
        run: cargo llvm-cov clean --workspace

      - name: Measure
        run: >
          cargo llvm-cov --workspace --locked --branch
          --json --output-path coverage.json

      - name: Enforce floors
        run: python3 scripts/check_coverage.py coverage.json

      # Not coverage, but the same class of tool: a script whose whole job is
      # to report a number correctly. Its self-check guards the one distinction
      # it exists to make -- a libFuzzer `NEW` line is a new *feature*, not a
      # new edge -- which D36 records getting wrong by hand first. Needs no
      # logs, so it costs nothing to keep honest here.
      - name: Fuzz saturation parser self-check
        run: python3 scripts/fuzz_saturation.py --self-test

      # Kept regardless of outcome: when the job fails, the report is the first
      # thing anyone wants.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: warn

  # CLAUDE.md Phase 1 definition of done: proptests green at 10k cases. Far too
  # slow for a per-push job, so it runs nightly and on demand.
  #
  # NOTE: because of the `if:` below this job is *skipped* on pull requests, and
  # GitHub never treats a skipped check as satisfying a required status check.
  # Do not add it to branch protection or every PR will block forever.
  proptest-sweep:
    name: proptest 10k
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Property sweep
        env:
          PROPTEST_CASES: "10000"
        run: >
          cargo test --release --workspace --locked
          --test properties --test differential

      # The differential harness at its strictest: a cold root rebuild after
      # *every* block, at a deeper tree. Roughly 10^8 hashes, which is why the
      # per-push job runs a cheaper setting — a check slow enough to be skipped
      # protects nothing. Fixtures are gitignored, so this only does real work
      # on a runner that has them; it stays green and says so otherwise.
      - name: Differential harness, strict
        env:
          ZUTREEXO_HARNESS_DEPTH: "14"
          ZUTREEXO_ROOT_CHECK_EVERY: "1"
        run: >
          cargo test --release --workspace --locked
          --test harness_replay --test corpus -- --nocapture

      # CLAUDE.md Phase 3 definition of done: kill -9 during a save must leave
      # the store recoverable with no root divergence. Release only — the
      # harness spawns a writer and kills it mid-write, and unoptimised the
      # writer cannot build its state before the readiness timeout, so every
      # round would skip and the test would pass having done nothing. It
      # declines to run in debug and says so.
      - name: Crash harness, definition of done
        run: >
          cargo test --release -p zutreexo-chain --locked
          --test crash -- --nocapture

      # CLAUDE.md Phase 2 definition of done: 10^6 randomised reorgs with zero
      # divergence. Runs in about 75 seconds — it was only ever slow because an
      # earlier fuzzer let the chain grow unboundedly, making each cold replay
      # progressively more expensive. See ReorgConfig::chain_len.
      - name: Reorg fuzzer, definition of done
        env:
          ZUTREEXO_REORG_ITERATIONS: "1000000"
        run: >
          cargo test --release --workspace --locked
          --test reorg_fuzz -- --nocapture
