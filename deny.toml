# cargo-deny configuration.
#
# The licensing rule here is the enforcement arm of the decision in
# docs/design.md: zutreexo is MIT OR Apache-2.0 and must not acquire a copyleft
# dependency. CLAUDE.md §3 singles out ZODL Slipstream (AGPL-3.0-only) — linking
# it would relicense this entire project, including for users interacting with
# it over a network. Reading its source for ideas is fine; linking is not, and
# the `deny` list below makes an accidental `cargo add` fail CI rather than
# fail review.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything we intend to depend on: librustzcash, Zebra, and rustreexo are all
# MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # `bitcoin_hashes`, `bitcoin-io`, and friends, pulled in by `rustreexo`.
    # CC0-1.0 is a public-domain dedication and is what the Rust Bitcoin
    # ecosystem standardised on. Permissive, but noted here because some
    # organisations exclude it over its explicit patent-rights disclaimer — if
    # that becomes a problem, it arrives with `rustreexo`, so revisit alongside
    # the upstream blocker in docs/design.md.
    "CC0-1.0",
]
confidence-threshold = 0.93

# MPL-2.0 is deliberately *not* in the allow list above. It is far weaker than
# the AGPL case D1 is guarding against — copyleft applies per-file, so merely
# depending on an MPL crate imposes nothing on this project's licensing — but
# allowing it wholesale would stop us noticing the next one that appears.
#
# `option-ext` arrives transitively: zebra-chain → dirs → dirs-sys → option-ext.
# We do not modify it, so the file-level obligation never attaches.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Copyleft licences are excluded by omission from `licenses.allow` above; these
# entries name the specific crates we have reason to expect someone might try
# to add, so the failure message says why rather than just "license not allowed".
deny = [
    # AGPL-3.0-only. See CLAUDE.md §3 and docs/design.md.
    { name = "slipstream", reason = "AGPL-3.0-only; linking it would relicense zutreexo. Reimplement, or read for ideas only." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# One git dependency, and it is a fork of v0.6.0 carrying a single upstream
# one-line fix: mit-dci/rustreexo#152, which repairs the D10 blocker that made
# `MemForest` generate invalid inclusion proofs after any deletion. Without it
# the transparent half of the design does not work at all — see
# `docs/design.md` D10 and D25.
#
# A fork rather than the PR author's branch, so the code being built is under an
# account this project controls. **Remove this entry and return to the published
# crate when upstream merges**; `tests/upstream_rustreexo.rs` asserts the fixed
# behaviour, so losing the pin fails loudly rather than silently reintroducing
# invalid proofs.
allow-git = ["https://github.com/USCMig/rustreexo"]
