[package]
name = "zutreexo-chain"
description = "Zcash chain semantics over the zutreexo accumulators: block application and reorg handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zutreexo-accumulator.workspace = true
thiserror.workspace = true
zebra-chain.workspace = true
# Used in error messages (hex txids), so a real dependency, not dev-only.
hex.workspace = true

# No dev-dependency on zutreexo-testkit. It was unused, and since stage 2b the
# testkit depends on *this* crate — `harness` has to reach the code it drives.
# Cargo tolerates the resulting dev-dependency cycle, but it makes this crate's
# tests link a testkit that links back here, for no benefit. The differential
# tests live in the testkit instead; `tests/fixture_replay.rs` here deliberately
# exercises `apply_block` alone, at a depth close to production.

[lints]
workspace = true
